<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="titulo-pagina">Blog · Differentissgood Weddings</title>
  <meta name="theme-color" content="#faf6f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17130f" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>

  <div class="grano" aria-hidden="true"></div>

  <header class="cabecera" data-fija="true">
    <a class="marca" href="../index.html">
      <span class="marca__ico">D</span>
      <span class="marca__txt">Differentissgood</span>
    </a>
    <nav class="menu" aria-label="Secciones">
      <a href="../index.html#quienes-somos">Quiénes somos</a>
      <a href="../portfolio.html">Portfolio</a>
      <a href="../index.html#presupuesto">Presupuesto</a>
      <a href="../index.html#video">Vídeo</a>
      <a href="../blog.html">Blog</a>
      <a href="../index.html#contacto">Contacto</a>
    </nav>
    <a href="../index.html#presupuesto" class="btn btn--solido btn--peque">Pide presupuesto</a>
  </header>

  <main class="articulo" id="articulo">
    <p>Cargando…</p>
  </main>

  <footer class="pie">
    <div class="envoltura">
      <div class="pie__marca"><span class="marca__ico">D</span><span>Differentissgood</span></div>
      <p class="pie__firma">Barcelona · Diseñado por Differentissgood</p>
    </div>
  </footer>

  <script src="posts.js"></script>
  <script>
    const slug = new URLSearchParams(location.search).get('post');
    const post = POSTS.find((p) => p.slug === slug);
    const contenedor = document.getElementById('articulo');

    if (!post) {
      contenedor.innerHTML = `
        <a class="legal__volver" href="../blog.html">← Volver al blog</a>
        <h1>Entrada no encontrada</h1>
        <p>Puede que el enlace esté mal escrito o que la entrada se haya eliminado.</p>`;
    } else {
      document.getElementById('titulo-pagina').textContent = `${post.titulo} · Differentissgood Weddings`;
      const fecha = new Date(post.fecha).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
      contenedor.innerHTML = `
        <a class="legal__volver" href="../blog.html">← Volver al blog</a>
        <p class="articulo__fecha">${fecha}</p>
        <h1>${post.titulo}</h1>
        <figure class="articulo__foto">
          <img src="../${post.foto}" alt="${post.titulo}">
        </figure>
        <div class="articulo__cuerpo">
          ${post.cuerpo.map((parrafo) => `<p>${parrafo}</p>`).join('')}
        </div>
        <a class="legal__volver" href="../blog.html">← Volver al blog</a>`;
    }
  </script>
</body>
</html>
