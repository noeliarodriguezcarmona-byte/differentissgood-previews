<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog · Differentissgood Weddings</title>
  <meta name="description" content="Historias de boda, trabajos y servicios de Differentissgood.">
  <meta name="theme-color" content="#faf6f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17130f" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="grano" aria-hidden="true"></div>

  <header class="cabecera" data-fija="true" id="cabecera">
    <a class="marca" href="index.html">
      <span class="marca__ico">D</span>
      <span class="marca__txt">Differentissgood</span>
    </a>
    <nav class="menu" aria-label="Secciones">
      <a href="index.html#quienes-somos">Quiénes somos</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="index.html#video">Vídeo</a>
      <a href="blog.html" aria-current="true">Blog</a>
      <a href="index.html#contacto">Contacto</a>
    </nav>
    <a href="index.html#contacto" class="btn btn--solido btn--peque">Pide presupuesto</a>
    <button class="menu__abrir" aria-expanded="false" aria-controls="menu-movil" aria-label="Abrir menú">
      <span></span><span></span>
    </button>
  </header>

  <div class="menu-movil" id="menu-movil" hidden>
    <button class="menu-movil__x" id="menu-movil-cerrar" aria-label="Cerrar menú">×</button>
    <a href="index.html#quienes-somos">Quiénes somos</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="index.html#video">Vídeo</a>
    <a href="blog.html">Blog</a>
    <a href="index.html#contacto" class="destacado">Contacto</a>
  </div>

  <main class="blog-pagina">
    <div class="seccion__cab sube">
      <p class="etiqueta">Blog</p>
      <h2>Historias de boda</h2>
    </div>
    <div class="blog__fila" id="blog-fila-completa"></div>
  </main>

  <footer class="pie">
    <div class="envoltura">
      <div class="pie__marca"><span class="marca__ico">D</span><span>Differentissgood</span></div>
      <p class="pie__firma">Barcelona · Diseñado por Differentissgood</p>
    </div>
  </footer>

  <script src="blog/posts.js"></script>
  <script>
    const fila = document.getElementById('blog-fila-completa');
    const ordenados = [...POSTS].sort((a, b) => b.fecha.localeCompare(a.fecha));
    fila.innerHTML = ordenados.map(({ slug, titulo, fecha, resumen, foto }) => `
      <a class="tarjeta-post sube visible" href="blog/post.html?post=${slug}">
        <figure class="tarjeta-post__foto">
          <img src="${foto}" alt="${titulo}" loading="lazy">
        </figure>
        <p class="tarjeta-post__fecha">${new Date(fecha).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' })}</p>
        <h3>${titulo}</h3>
        <p class="tarjeta-post__resumen">${resumen}</p>
      </a>`).join('');

    document.querySelector('.menu__abrir').addEventListener('click', () => {
      document.getElementById('menu-movil').hidden = false;
    });
    document.getElementById('menu-movil-cerrar').addEventListener('click', () => {
      document.getElementById('menu-movil').hidden = true;
    });
  </script>
</body>
</html>
